name: MusePanel
options:
  bundleIdPrefix: site.xiezhaoye
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${MUSE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MusePanel:
    type: application
    platform: iOS
    sources:
      - MusePanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.xiezhaoye.musepanel
        PRODUCT_NAME: MusePanel
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MusePanel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Muse 网页的语音输入需要使用麦克风。
        INFOPLIST_KEY_NSCameraUsageDescription: Muse 网页上传照片时可能需要使用相机。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Muse 网页上传图片时需要读取相册。
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
